name: Build Standalone Executables (Windows & macOS)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: PromptGenerator-Windows.exe
            built_path: dist/PromptGenerator.exe
          - os: macos-latest
            artifact_name: PromptGenerator-macOS
            built_path: dist/PromptGenerator

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Verify Unit Tests & Integrity Hash
        run: |
          pip install pytest
          pytest tests/ -v

      - name: Build Standalone Executable via PyInstaller
        run: |
          pyinstaller PromptGenerator.spec --noconfirm --clean

      - name: Post-process macOS Binary Permissions
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/PromptGenerator
          codesign --force --deep --sign - dist/PromptGenerator || true
          cp dist/PromptGenerator dist/PromptGenerator-macOS
          chmod +x dist/PromptGenerator-macOS
          tar -czf dist/PromptGenerator-macOS.tar.gz -C dist PromptGenerator

      - name: Upload Windows Executable Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PromptGenerator-Windows
          path: dist/PromptGenerator.exe

      - name: Upload macOS Executable Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PromptGenerator-macOS
          path: dist/PromptGenerator-macOS

      - name: Upload macOS Tarball Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PromptGenerator-macOS-Archive
          path: dist/PromptGenerator-macOS.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: PromptGenerator-Windows
          path: release/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: PromptGenerator-macOS
          path: release/

      - name: Download macOS Tarball Artifact
        uses: actions/download-artifact@v4
        with:
          name: PromptGenerator-macOS-Archive
          path: release/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Prompt Generator v1.0.0 (Windows & macOS Standalone)"
          draft: false
          prerelease: false
          body: |
            ### Prompt Generator Standalone Desktop Subsystem v1.0.0
            
            - **`PromptGenerator-macOS`**: Standalone single executable binary for macOS. Run directly in Terminal or double-click.
            - **`PromptGenerator.exe`**: Standalone single executable for Windows (Terminal-free).
            - **`PromptGenerator-macOS.tar.gz`**: Portable compressed archive for macOS.
          files: |
            release/PromptGenerator.exe
            release/PromptGenerator-macOS
            release/PromptGenerator-macOS.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
