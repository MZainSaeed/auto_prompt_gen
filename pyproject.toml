[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-generator"
version = "1.0.0"
description = "Antigravity CLI Prompt Generator Subsystem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
